# Build index.html and life.html from src/ and publish the repository tree to GitHub Pages.
# The built pages are not committed; this replaces "deploy from branch" with a build on every push to main.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wat2wasm
        run: sudo apt-get update -q && sudo apt-get install -y -q wabt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: ./build.sh
      - name: Test
        run: node test/mix.test.mjs && node test/band.test.mjs && node test/lemma.test.mjs
      - name: Site tree
        run: |
          mkdir -p site
          cp index.html life.html README.md site/
          cp -r src docs tools site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
